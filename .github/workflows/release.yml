name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish portable application
        shell: pwsh
        run: dotnet publish GraphicsSettingsMigrator.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o dist/portable

      - name: Package release
        shell: pwsh
        run: |
          Copy-Item README.md, SUPPORTED_APPS.md -Destination dist/portable
          Compress-Archive -Path dist/portable/* -DestinationPath dist/GraphicsSettingsMigrator-win-x64.zip -Force

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/portable/GraphicsSettingsMigrator.exe
            dist/GraphicsSettingsMigrator-win-x64.zip
